openapi: 3.0.3
info:
  title: RealityEngine CPP - Perception Engine API
  version: 1.1.0-cpp
  description: |
    OpenAPI contract for the native C++ Perception Engine service.

    The service defaults to `http://localhost:5300` and pushes assembled
    vectors into the Reality Engine at `http://localhost:5301/api/perceive`.
    The MQTT bridge, when enabled, subscribes to a broker (default
    `mqtt://yuma.lateraledge.cloud:1883`) and projects sensor messages
    into perceptual-space regions via the mapping registry — same
    contract across AI / CPP / LSP runtimes.
servers:
  - url: http://localhost:5300
    description: Local Perception Engine default
tags:
  - name: System
  - name: State
  - name: Push
  - name: Sources
  - name: Sensors
  - name: MQTT
  - name: LocalAI
  - name: Ollama
  - name: OpenAI
  - name: ACP
  - name: HealthKit
  - name: CareKit
  - name: Completions
  - name: Triggers
  - name: Dispatch
  - name: Machines
paths:
  /:
    get:
      tags: [System]
      summary: Service root
      responses:
        "200":
          description: Service identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Object"
  /api/health:
    get:
      tags: [System]
      summary: Health check
      responses:
        "200":
          description: Healthy service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/state:
    get:
      tags: [State]
      summary: Current perception engine state
      responses:
        "200":
          description: State snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Object"
  /api/config:
    patch:
      tags: [State]
      summary: Update perception matching configuration
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                matchAlgorithm:
                  type: string
                  enum: [gte, equals]
      responses:
        "200":
          description: Updated config
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  matchAlgorithm:
                    type: string
  /api/reset:
    post:
      tags: [State]
      summary: Reset sources, persistent vector, and last-push state
      responses:
        "200":
          description: Reset result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "409":
          description: Push is already in progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/push:
    post:
      tags: [Push]
      summary: Push the assembled perceptual vector to Reality Engine
      description: |
        Synchronous by default. Set `async: true` to enqueue the push and poll
        `GET /api/push/{id}`.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushRequest"
      responses:
        "200":
          description: Synchronous push result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushResult"
        "202":
          description: Async push accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushAccepted"
        "409":
          description: Push already in progress; duplicate was coalesced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Push worker queue is full
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/push/{id}:
    get:
      tags: [Push]
      summary: Read async push job status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Push job record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushJob"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/auto/start:
    post:
      tags: [Push]
      summary: Mark auto-push running and set interval
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                intervalMs:
                  type: number
                  default: 1000
      responses:
        "200":
          description: Auto state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Object"
  /api/auto/stop:
    post:
      tags: [Push]
      summary: Stop auto-push state
      responses:
        "200":
          description: Stop result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
  /api/sources:
    get:
      tags: [Sources]
      summary: List configured perception sources
      responses:
        "200":
          description: Source list
          content:
            application/json:
              schema:
                type: object
                properties:
                  sources:
                    type: array
                    items:
                      $ref: "#/components/schemas/Source"
    post:
      tags: [Sources]
      summary: Add a source
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourceInput"
      responses:
        "200":
          description: Created source
          content:
            application/json:
              schema:
                type: object
                properties:
                  source:
                    $ref: "#/components/schemas/Source"
  /api/sources/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    patch:
      tags: [Sources]
      summary: Replace a source by id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourceInput"
      responses:
        "200":
          description: Updated source
          content:
            application/json:
              schema:
                type: object
                properties:
                  source:
                    $ref: "#/components/schemas/Source"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Sources]
      summary: Remove a source
      responses:
        "200":
          description: Removal result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
  /api/sensors/{sensorId}:
    post:
      tags: [Sensors]
      summary: Update an existing sensor source value
      parameters:
        - name: sensorId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [values]
              properties:
                values:
                  $ref: "#/components/schemas/Vector"
      responses:
        "200":
          description: Sensor update result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Object"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/signals:
    post:
      tags: [Sensors]
      summary: Ingest a generic external signal and optionally trigger push
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignalInput"
      responses:
        "200":
          description: Signal ingestion result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Object"
  /api/mqtt/status:
    get:
      tags: [MQTT]
      summary: MQTT bridge connection state + counters
      description: |
        Returns `enabled=false` when MQTT_BROKER_HOST is unset or
        MQTT_DISABLED=1.  Otherwise reports connection state, broker
        config, and bridge-level counters: messagesReceived,
        messagesMapped, messagesRejected, messagesUnmatched,
        pushesTriggered.  Same shape across AI / CPP / LSP.
      responses:
        "200":
          description: Bridge status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MqttBridgeStatus"
  /api/mqtt/mappings:
    get:
      tags: [MQTT]
      summary: Loaded MQTT mapping registry + per-rule counters
      description: |
        Returns the topic→region projection rules currently in force,
        each decorated with runtime counters (received / mapped /
        rejected / lastError).  Per the design rule, topics never
        embed offsets — the registry is the sole authority.
      responses:
        "200":
          description: Mapping registry snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MqttMappingsResponse"
  /api/integrations/localai/status:
    get:
      tags: [LocalAI]
      summary: localAIStack integration status
      responses:
        "200":
          description: Integration status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Object"
  /api/integrations/status:
    get:
      tags: [Completions]
      summary: Provider-neutral integration registry status
      description: |
        Reports the startup-loaded `INTEGRATIONS_CONFIG` registry, including
        configured providers and source mappings available to completion
        callbacks.
      responses:
        "200":
          description: Integration registry status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Object"
  /api/integrations/localai/catalog:
    get:
      tags: [LocalAI]
      summary: Discover allowed localAIStack integration endpoints
      responses:
        "200":
          description: Integration catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Object"
  /api/integrations/localai/bootstrap:
    post:
      tags: [LocalAI]
      summary: Register localAIStack sensor sources and import bridge machines
      responses:
        "200":
          description: Bootstrap result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Object"
  /api/integrations/localai/invoke:
    post:
      tags: [LocalAI]
      summary: Invoke an allowed localAIStack endpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocalAIInvokeRequest"
      responses:
        "200":
          description: Invocation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Object"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: Endpoint is not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: localAIStack invocation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/integrations/ollama/status:
    get:
      tags: [Ollama]
      summary: Local Ollama adapter status
      description: Reports configured Ollama endpoint/model and `/api/tags` reachability.
      responses:
        "200":
          description: Ollama adapter status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Object"
  /api/integrations/ollama/dispatch:
    post:
      tags: [Ollama]
      summary: Deliver a recorded dispatch envelope to local Ollama
      description: |
        Caller-driven local adapter execution. PE reads an existing dispatch
        record, calls Ollama `/api/chat`, annotates the dispatch ledger, and
        optionally commits model-produced `values` through completion ingest.
        PE push cycles do not wait on this endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OllamaDispatchRequest"
      responses:
        "200":
          description: Ollama dispatch completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Object"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          description: Ollama invocation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/integrations/openai/status:
    get:
      tags: [OpenAI]
      summary: OpenAI Responses API adapter status
      description: Reports configured OpenAI endpoint/model, API-key presence, and `/models` reachability when configured.
      responses:
        "200":
          description: OpenAI adapter status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Object"
  /api/integrations/openai/dispatch:
    post:
      tags: [OpenAI]
      summary: Deliver a recorded dispatch envelope to the OpenAI Responses API
      description: |
        Caller-driven provider adapter execution. PE reads an existing dispatch
        record, calls OpenAI `POST /v1/responses`, annotates the dispatch
        ledger, and optionally commits model-produced `values` through
        completion ingest. PE push cycles do not wait on this endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenAIDispatchRequest"
      responses:
        "200":
          description: OpenAI dispatch completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Object"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          description: OpenAI invocation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/integrations/acp/status:
    get:
      tags: [ACP]
      summary: ACP/OpenClaw xACP adapter status
      description: |
        Reports the configured OpenClaw ACP command, Gateway URL, session key,
        target agent, completion source mapping, and fixed no-wait dispatch
        contract. This endpoint does not contact OpenClaw.
      responses:
        "200":
          description: ACP adapter status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Object"
  /api/integrations/acp/dispatch:
    post:
      tags: [ACP]
      summary: Accept a recorded dispatch envelope for external ACP/OpenClaw handling
      description: |
        Caller-driven no-wait adapter receipt. PE reads an existing dispatch
        record, annotates the dispatch ledger with an OpenClaw/xACP handoff,
        and returns `202 Accepted`. PE does not launch OpenClaw and does not
        wait for ACP output. Finished ACP work must return through
        `/api/integrations/completions`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcpDispatchRequest"
      responses:
        "202":
          description: ACP handoff accepted and recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Object"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/integrations/healthkit/status:
    get:
      tags: [HealthKit]
      summary: HealthKit bridge ingest contract status
      description: |
        Reports PE-side bridge settings. Native HealthKit authorization,
        anchored reads, device storage, and HealthKit writes are owned by an
        external Apple-platform bridge app, not this service.
      responses:
        "200":
          description: HealthKit bridge contract status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Object"
  /api/integrations/healthkit/ingest:
    post:
      tags: [HealthKit]
      summary: Ingest bridge-approved HealthKit samples into PE sources
      description: |
        Accepts normalized values from a native Apple HealthKit bridge and maps
        them into configured PE sensor sources. The endpoint accepts one sample
        or `samples[]`; it does not perform native HealthKit authorization,
        anchored queries, or HealthKit writes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HealthKitIngestRequest"
      responses:
        "200":
          description: HealthKit sample(s) ingested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Object"
        "207":
          description: Batch accepted with one or more failed samples
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Object"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Optional bridge token rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/integrations/carekit/status:
    get:
      tags: [CareKit]
      summary: CareKit bridge ingest contract status
      description: |
        Reports PE-side bridge settings. Native CareKit store access, care
        plans, tasks, outcomes, contacts, UI, and writeback are owned by an
        external Apple-platform bridge app, not this service.
      responses:
        "200":
          description: CareKit bridge contract status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Object"
  /api/integrations/carekit/ingest:
    post:
      tags: [CareKit]
      summary: Ingest bridge-approved CareKit samples into PE sources
      description: |
        Accepts normalized values from a native Apple CareKit bridge and maps
        them into configured PE sensor sources. The endpoint accepts one task or
        outcome sample or `samples[]`; it does not perform native CareKit store
        access or writeback.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CareKitIngestRequest"
      responses:
        "200":
          description: CareKit sample(s) ingested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Object"
        "207":
          description: Batch accepted with one or more failed samples
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Object"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Optional bridge token rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/integrations/completions:
    post:
      tags: [Completions]
      summary: Commit provider or agent completion as a PE source update
      description: |
        Accepts completion callbacks from OpenAI, Ollama, MCP, CLI, HTTPS, or
        WebSocket adapters and maps them into the same sensor-source path used
        by `/api/signals`. The request does not wait for agent work; it records
        a completed result that has already arrived.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompletionInput"
      responses:
        "200":
          description: Completion mapped into a PE source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Object"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/triggers/status:
    get:
      tags: [Triggers]
      summary: Trigger envelope dispatcher status
      description: |
        Reports whether PE trigger-envelope recording is enabled, the configured
        dispatch mode, endpoint metadata, and counters for envelopes created or
        dropped. Trigger dispatch is asynchronous with respect to PE cycles.
      responses:
        "200":
          description: Trigger dispatcher status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Object"
  /api/dispatch/ledger:
    get:
      tags: [Dispatch]
      summary: Recent trigger dispatch ledger records
      description: |
        Returns recent fire-and-record trigger envelopes. The ledger is audit
        metadata, not a workflow queue; external completions return later
        through ordinary PE source mappings.
      responses:
        "200":
          description: Dispatch ledger snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Object"
  /api/dispatch/records/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Dispatch]
      summary: Read one dispatch ledger record
      responses:
        "200":
          description: Dispatch record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Object"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Dispatch]
      summary: Annotate dispatch delivery state
      description: |
        Updates audit metadata for a trigger dispatch record, such as adapter
        delivery status or provider run id. This is not a completion path and
        does not resume PE or RE work; completed agent results still return via
        `/api/integrations/completions` or `/api/signals`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DispatchRecordUpdate"
      responses:
        "200":
          description: Updated dispatch record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Object"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/machines:
    get:
      tags: [Machines]
      summary: Proxy Reality Engine machine list
      responses:
        "200":
          description: Machine list from Reality Engine
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Object"
        "502":
          description: Reality Engine proxy failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Object:
      type: object
      additionalProperties: true
    Vector:
      type: array
      items:
        type: number
        format: double
    Success:
      type: object
      properties:
        success:
          type: boolean
    Error:
      type: object
      additionalProperties: true
      properties:
        success:
          type: boolean
        error:
          type: string
    Health:
      type: object
      properties:
        status:
          type: string
          example: healthy
        timestamp:
          type: number
    Region:
      type: object
      required: [offset, length]
      properties:
        offset:
          type: integer
        length:
          type: integer
    Source:
      type: object
      description: |
        Perception source. The service auto-materializes inactive `test`
        sources from loaded machine `inputSequences`; their regions match the
        machine input mapping, their inputs match the authored test vectors, and
        their `metadata` and `sequence` fields preserve the full authored
        test-sequence representation.
      additionalProperties: true
      properties:
        id:
          type: string
        type:
          type: string
          enum: [test, simulated, sensor]
        kind:
          type: string
        name:
          type: string
        active:
          type: boolean
          description: Auto-generated machine test-sequence sources default to false.
        region:
          $ref: "#/components/schemas/Region"
        machineId:
          type: string
        machineName:
          type: string
        sequenceName:
          type: string
        inputs:
          type: array
          items:
            $ref: "#/components/schemas/Vector"
        metadata:
          type: object
          description: Authored metadata from the machine input sequence.
        sequence:
          type: object
          description: Full authored machine input sequence represented by this source.
        loop:
          type: boolean
        sensorId:
          type: string
        lastValue:
          $ref: "#/components/schemas/Vector"
        ttlMs:
          type: number
        pattern:
          type: string
          enum: [constant, sine, square, sawtooth]
        frequency:
          type: number
        amplitude:
          type: number
        dcOffset:
          type: number
    SourceInput:
      allOf:
        - $ref: "#/components/schemas/Source"
      required: [id]
    PushRequest:
      type: object
      properties:
        compact:
          type: boolean
          description: When true, defaults includeMachineResults to false.
        includeMachineResults:
          type: boolean
        async:
          type: boolean
          default: false
    PushAccepted:
      type: object
      properties:
        success:
          type: boolean
        accepted:
          type: boolean
        jobId:
          type: string
        statusEndpoint:
          type: string
    PushResult:
      type: object
      additionalProperties: true
      properties:
        success:
          type: boolean
        step:
          nullable: true
          type: object
          additionalProperties: true
        timestamp:
          type: number
        globalStep:
          type: number
        error:
          nullable: true
          type: string
    PushJob:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
          enum: [queued, running, completed, failed]
        createdAt:
          type: number
        updatedAt:
          type: number
        result:
          $ref: "#/components/schemas/PushResult"
    SignalInput:
      type: object
      required: [values]
      properties:
        sensorId:
          type: string
        name:
          type: string
        region:
          $ref: "#/components/schemas/Region"
        values:
          $ref: "#/components/schemas/Vector"
        active:
          type: boolean
        ttlMs:
          type: number
          default: 30000
        triggerPush:
          type: boolean
          default: false
        compactPush:
          type: boolean
          default: false
    CompletionInput:
      type: object
      required: [values]
      properties:
        provider:
          type: string
          description: openai, ollama, localai, mcp, cli, https, ws, or another adapter id.
        agent:
          type: string
        agentId:
          type: string
        completionId:
          type: string
        sourceMappingId:
          type: string
          description: Identifier from the startup-loaded integration registry.
        mappingId:
          type: string
          deprecated: true
          description: Compatibility alias for sourceMappingId.
        correlationId:
          type: string
        envelopeId:
